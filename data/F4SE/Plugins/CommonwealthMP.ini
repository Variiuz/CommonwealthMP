[Network]
; JOIN and HOST panels edit these.
; Console: cmp_join 127 0 0 1 7777
Host=127.0.0.1
Port=7777
; Optional path to CommonwealthMP.Server.exe (default: next to CommonwealthMP.dll)
ServerExe=
; Optional server password (max 15 chars). JOIN/HOST panels also have a field.
Password=
; 1 = join after a save loads. Title HOST auto-joins localhost after load.
AutoJoin=0
; Remote body render delay in ms. -1 = auto (~1.5 pose ticks + RTT/2). 0 = snap to sample.
InterpDelayMs=-1
; Reliable-channel resend attempts for critical packets.
ReliableRetries=8
; Drop incomplete appearance/inventory assemblies after this many ms.
BlobAssembleTtlMs=5000

[Ghost]
EditorID=CMP_RemotePlayer

[Session]
; Empty = generate once next to the DLL.
PlayerKey=
; JOIN Name writes this. Empty = Steam persona.
PlayerName=

[Debug]
PoseHz=20
PointerHud=1
PointerSeconds=4

[UI]
; 1 = open the ImGui overlay automatically when a save loads
OverlayVisible=0
; 1 = show the chat panel by default
ChatOpen=1
; 1 = show the debug panel by default
DebugOpen=1
; Decimal virtual-key code to toggle the overlay (45 = Insert, 112 = F1, 113 = F2)
ToggleKey=45
; Font scale percentage (100 = 1.0x)
FontScale=100

[Presence]
; Discord shows "Playing CMP" (needs CMP_DISCORD_APP_ID set at plugin build time).
Discord=1
; Steam Rich Presence piggybacks on Fallout 4; off by default (FO4 steam_api64 is too old for most builds).
Steam=0
