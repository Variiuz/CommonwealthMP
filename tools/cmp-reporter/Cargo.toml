[package]
name = "cmp-reporter"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
eframe = "0.29"
egui = "0.29"
open = "5.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
walkdir = "2.5.0"
winreg = "0.56.0"
zip = "8.6.0"
